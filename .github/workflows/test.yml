name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned via .nvmrc so the rule-corpus gates below are not run on whatever the runner
      # image happens to ship. These scripts are deliberately dependency-free (Node built-ins
      # only), so there is no install step and no registry to be unavailable.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      # First, before anything else: a credentialed endpoint or key in a tracked file fails the build.
      # Added after an evidence file carrying a real Alchemy key was committed to this public repo.
      - name: No secrets in tracked files
        run: node script/check-no-secrets.mjs

      - name: The secret scan exempts no file and never prints a hit
        run: node script/test-check-no-secrets.mjs

      - name: Archive probe proof integrity (fixed keyless urls, no env urls, bounded, classified)
        run: node script/test-probe-proof.mjs

      - name: Archive probe refuses weakened TLS and non-canonical identity strings
        run: node script/test-probe-tls.mjs

      - name: Archive probe refuses every form of widened TLS trust (checks the trust store, not setting names)
        run: node script/test-probe-tls-bypass.mjs

      - name: Archive probe re-checks trust before every request (delayed and same-size trust-store changes)
        run: node script/test-probe-tls-deferred.mjs

      - name: Every contract invariant maps to real tests, corpus rows or scripts (T1.4)
        run: node script/check-invariants.mjs

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

      # PROOF_STANDARD.md Version 3 gates. All offline: no network, no credentials, no chain.
      - name: Rule corpus matches its generator
        run: node script/build-cases.mjs --check

      - name: Reference implementation agrees with the corpus
        run: node script/rule-reference.mjs

      - name: Missing or failed evidence fails the reference, never skips it
        run: node script/test-rule-reference.mjs

      - name: Every SPEC 5.2 clause is load-bearing (reference implementation)
        run: node script/mutate-reference.mjs

      - name: External surface is exactly the allowlist (N7 no setters, N10 no pause)
        run: node script/check-surface.mjs

  # The Solidity mutation sweep compiles the contract once per mutant under via_ir, which cannot be turned
  # off (stack too deep), so it is the slow gate. It runs on pull requests (before anything reaches main) and
  # on demand, not on every push; every other gate above still runs on every push.
  mutation:
    name: Solidity mutation sweep
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Every mutated clause is load-bearing (shipping library and MakoRoundsV1)
        env:
          MAKO_MUTATION_JOBS: 3
        run: node script/mutate-solidity.mjs
