[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

# Read-only, and only the fixtures directory. Without this `vm.readFile` on the vendored
# reports and the rule-case corpus is denied and the suite fails on its first run. `ffi`
# stays off. `./deployments` is read-write so DeployRoundsV1 can write its deployment receipt (and tests read it back) on a
# broadcast, and nothing else. `./broadcast` is readable so `verifyDeployment` can bind the address to
# the script's own CREATE transaction in forge's broadcast record.
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./broadcast" }]

# CI already sets FOUNDRY_PROFILE: ci (.github/workflows/test.yml), but no such profile
# existed, so CI silently ran the default profile. It inherits the default and exists so
# CI behaviour is separable from local behaviour. A profile does NOT grant filesystem
# access: fs_permissions above is separate and must be explicit.
[profile.ci]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./broadcast" }]
verbosity = 3

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz/"
